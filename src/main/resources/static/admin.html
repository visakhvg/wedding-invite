<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>RSVP replies</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 1.5rem; color: #12201e; background: #f4f7f2; }
    h1 { font-size: 1.5rem; margin: 0 0 1rem; }
    form { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
    input { padding: .6rem .8rem; border: 2px solid #b9c4c0; border-radius: 8px; font: inherit; }
    button { padding: .6rem 1rem; border: 0; border-radius: 8px; background: #0e3b35; color: #fff; font: inherit; cursor: pointer; }
    table { border-collapse: collapse; width: 100%; background: #fff; }
    th, td { text-align: left; padding: .6rem .8rem; border-bottom: 1px solid #dfe6e3; vertical-align: top; }
    .summary { margin: 0 0 1rem; font-weight: 600; }
    .err { color: #9b2c2c; }
    .wrap { overflow-x: auto; }
  </style>
</head>
<body>
  <h1>RSVP replies</h1>
  <form id="f">
    <input id="key" type="password" placeholder="Admin key" autocomplete="current-password" required>
    <button type="submit">Load replies</button>
  </form>
  <p id="msg" class="summary" role="status"></p>
  <div class="wrap"><table id="t" hidden>
    <thead><tr><th>When</th><th>Name</th><th>Coming</th><th>Guests</th><th>Note</th></tr></thead>
    <tbody></tbody>
  </table></div>
  <script>
    const msg = document.getElementById("msg"), table = document.getElementById("t");
    document.getElementById("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.className = "summary"; msg.textContent = "Loading…";
      try {
        const res = await fetch("/api/admin/rsvps", { headers: { "X-Admin-Key": document.getElementById("key").value } });
        if (res.status === 401) throw new Error("That admin key is wrong, or no key is set on the server.");
        if (!res.ok) throw new Error("Could not load replies.");
        const rows = await res.json();
        const body = table.querySelector("tbody");
        body.replaceChildren();
        let heads = 0;
        for (const r of rows) {
          const tr = document.createElement("tr");
          const cells = [new Date(r.createdAt).toLocaleString(), r.name, r.attending ? "Yes" : "No", r.attending ? r.guests : "", r.message || ""];
          for (const c of cells) { const td = document.createElement("td"); td.textContent = c; tr.append(td); }
          body.append(tr);
          if (r.attending) heads += r.guests;
        }
        table.hidden = rows.length === 0;
        msg.textContent = rows.length ? `${rows.length} replies, ${heads} guests coming.` : "No replies yet.";
      } catch (err) {
        msg.className = "summary err"; msg.textContent = err.message;
      }
    });
  </script>
</body>
</html>
