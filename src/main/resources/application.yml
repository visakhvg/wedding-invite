server:
  port: ${PORT:8080}          # Render sets PORT automatically
  compression:
    enabled: true

spring:
  datasource:
    # Stores RSVPs in a file. On Render's free plan the disk is wiped on each
    # deploy, so switch to Postgres (see README) if you need replies to last.
    url: jdbc:h2:file:./data/invite;AUTO_SERVER=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  web:
    resources:
      cache:
        period: 1h

  main:
    lazy-initialization: true
# ---------------------------------------------------------------------------
# EVERYTHING BELOW IS YOUR CONTENT. Edit the text, restart, done.
# Photos: put files in src/main/resources/static/assets/ and use "/assets/name.jpg"
# or set uploads-dir and use "/uploads/name.jpg".
# ---------------------------------------------------------------------------
invite:
  admin-key: ${INVITE_ADMIN_KEY:}                   # empty = admin page disabled; set INVITE_ADMIN_KEY to use it
  uploads-dir: ${INVITE_UPLOADS_DIR:}               # e.g. ./uploads (optional)

  groom:
    name: Visakh
    full-name: Visakh Venugopal
    photo: /assets/groom.svg
    about: Son of Shri. G Venugopalan Nair and Smt. S S Devi Priya
  bride:
    name: Aiswarya
    full-name: Aiswarya P Anil
    photo: /assets/bride.svg
    about: Daughter of Shri. Anil Shankar R.S  and Smt. Preetha Kumari C.P

  tagline: We are tying the knot
  intro-line: Brush the strings, listen for the chimes
  quote: And so, beneath the same sky that watched our story unfold, we gather the people we love to witness the day our two tomorrows become one.

  wedding-date-time: "2026-12-31T10:30:00"
  timezone-offset: "+05:30"
  wedding-date-label: Thursday, 31st December 2026

  closing-line: With love, Groom & Bride

  families:
    - title: The Groom's family
      text: Mr. Father Name & Mrs. Mother Name, together with family and friends, invite you to bless the union.
    - title: The Bride's family
      text: Mr. Father Name & Mrs. Mother Name, together with family and friends, invite you to bless the union.

  story:
    - title: How we met
      date: June 2021
      text: Write a few lines about the day you first met. Keep it short and warm.
      photo: /assets/story-1.svg
    - title: The first yes
      date: December 2023
      text: Write about the moment things became official.
      photo: /assets/story-2.svg
    - title: The engagement
      date: 10th May 2026
      text: Write about the engagement day and who was there.
      photo: /assets/eng1.JPG, /assets/eng2.JPG, /assets/eng3.JPG, /assets/eng4.JPG, /assets/eng5.JPG, /assets/eng6.JPG, /assets/eng7.JPG, /assets/eng8.JPG, /assets/eng9.JPG

  events:
    - name: Engagement
      time: Saturday, 8th August 2026
      place: Family home
      note: Celebrated with close family
    - name: Wedding ceremony
      time: Sunday, 14th February 2027, 10:30 AM
      place: Your Church or Temple Name
      note: Please be seated by 10:00 AM
    - name: Reception
      time: Sunday, 14th February 2027, 6:00 PM
      place: Your Auditorium Name
      note: Dinner will be served

  venue:
    name: Your Venue Name
    address: Street, Town, Kerala 695000
    # Google Maps > Share > Embed a map > copy the src="..." URL
    map-embed-url: https://www.google.com/maps?q=Thiruvananthapuram&output=embed
    map-link: https://www.google.com/maps/search/?api=1&query=Thiruvananthapuram

  music:
    file: /assets/SaptaSagaradaachEllo.mp3        # add your own licensed mp3; leave empty to hide the button
    credit: Add a song credit here

  creator:
    name: Visakh & Aiswarya
    link: https://www.instagram.com/

  rsvp:
    enabled: false
    heading: Will you be joining us?
    deadline: Please reply by 31st January 2027
